name: Pre-Deployment Checks

# Runs on every pull request (the "ci" job is a required check on main), and
# gives each same-repository pull request its own preview URL on Cloudflare.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Type check worker
        run: bunx tsc --noEmit -p worker

      - name: Lint
        run: bun run lint

      - name: Knip dead-code check
        run: bunx knip

      - name: Next.js build test
        run: bun run build

      - name: Check Cloudflare free-plan limits
        run: node scripts/check-cloudflare-limits.mjs

      - name: Cloudflare deploy dry run
        run: bunx wrangler deploy --dry-run

  preview:
    needs: ci
    # Forks don't get repository secrets, so they can't publish a preview.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_ACCOUNT_ID: 634ab7e4417267177c5057798e20265f
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Upload a preview version (never goes live)
        id: upload
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-upload.json
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::No CLOUDFLARE_API_TOKEN secret yet, so no preview for this pull request."
            exit 0
          fi
          bunx wrangler versions upload --preview-alias "pr-$PR" --tag "pr-$PR" --message "PR #$PR ${GITHUB_SHA::7}"
          url=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // .preview_url // empty' "$WRANGLER_OUTPUT_FILE_PATH")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Test the preview
        if: steps.upload.outputs.url != ''
        run: node scripts/smoke-test.mjs "${{ steps.upload.outputs.url }}"

      - name: Post the preview URL on the pull request
        if: steps.upload.outputs.url != ''
        run: |
          body="Preview of ${GITHUB_SHA::7}: ${{ steps.upload.outputs.url }}"
          gh pr comment "$PR" --edit-last --body "$body" 2>/dev/null || gh pr comment "$PR" --body "$body"
