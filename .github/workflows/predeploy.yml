name: Pre-Deployment Checks

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bunx tsc --noEmit

      - name: Type check worker
        run: bunx tsc --noEmit -p worker

      - name: Lint
        run: bun run lint

      - name: Knip dead-code check
        run: bunx knip

      - name: Next.js build test
        run: bun run build

      - name: Cloudflare deploy dry run
        run: bunx wrangler deploy --dry-run
