name: Uptime

# Checks imamzain.org every 15 minutes. When it fails, opens an issue labelled
# "outage" (watchers get an email) and comments on it while the site stays
# down; closes it once the site answers again.
# Note: GitHub pauses scheduled workflows after 60 days without any commit to
# the repository; re-enable it from the Actions tab if that happens.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SITE_URL: https://imamzain.org
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the site
        id: smoke
        continue-on-error: true
        run: node scripts/smoke-test.mjs "$SITE_URL" 2>&1 | tee "$RUNNER_TEMP/smoke.log"; exit "${PIPESTATUS[0]}"

      - name: Report an outage
        if: steps.smoke.outcome == 'failure'
        run: |
          body="$(printf 'The scheduled check of %s failed at %s UTC.\n\n```\n%s\n```\n\nRun: %s/%s/actions/runs/%s' \
            "$SITE_URL" "$(date -u '+%Y-%m-%d %H:%M')" "$(tail -n 30 "$RUNNER_TEMP/smoke.log")" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          open=$(gh issue list --label outage --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh label create outage --color B60205 --description "Site is down" --force
            gh issue create --title "imamzain.org is down" --label outage --body "$body"
          fi
          exit 1

      - name: Close the outage once the site is back
        if: steps.smoke.outcome == 'success'
        run: |
          for number in $(gh issue list --label outage --state open --json number --jq '.[].number'); do
            gh issue close "$number" --comment "Back up: the check at $(date -u '+%Y-%m-%d %H:%M') UTC passed."
          done
